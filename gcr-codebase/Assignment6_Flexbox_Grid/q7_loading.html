<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loading Animation</title>
<style>
  @keyframes bounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-40px); }
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #1a1a2e; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; }
  h2 { color: #e2b96f; font-family: Arial, sans-serif; margin-bottom: 20px; }
  .loader { display: flex; gap: 18px; align-items: center; }
  .circle { width: 22px; height: 22px; border-radius: 50%; animation: bounce 0.8s ease-in-out infinite; }
  .circle:nth-child(1) { background: #e63946; animation-delay: 0s; }
  .circle:nth-child(2) { background: #e2b96f; animation-delay: 0.15s; }
  .circle:nth-child(3) { background: #4cc9f0; animation-delay: 0.3s; }
</style>
</head>
<body>
<h2>Loading...</h2>
<div class="loader">
  <div class="circle"></div>
  <div class="circle"></div>
  <div class="circle"></div>
</div>
</body>
</html>
