<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Height and Width</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: Arial, sans-serif; background: #f0f2f5; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 40px 20px; gap: 30px; }
  h1 { color: #1a1a2e; }
  .row { display: flex; gap: 30px; align-items: center; justify-content: center; flex-wrap: wrap; }
  .box { display: flex; align-items: center; justify-content: center; text-align: center; font-size: 0.8rem; color: #fff; font-weight: bold; border-radius: 8px; padding: 10px; }
  .box1 { width: 150px; height: 150px; background: #e63946; min-height: 100px; max-width: 200px; }
  .box2 { width: 50%; height: 200px; background: #4361ee; min-height: 80px; max-width: 400px; overflow: hidden; }
  .box3 { width: 30vw; height: 25vh; background: #52b788; min-height: 100px; max-width: 350px; }
</style>
</head>
<body>
<h1>Height and Width Demo</h1>
<div class="row">
  <div class="box box1">width: 150px<br>height: 150px<br>min-height: 100px<br>max-width: 200px</div>
  <div class="box box2">width: 50%<br>height: 200px<br>overflow: hidden<br>max-width: 400px</div>
  <div class="box box3">width: 30vw<br>height: 25vh<br>min-height: 100px<br>max-width: 350px</div>
</div>
</body>
</html>
