<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Question 12 - HTML Entities</title>
</head>
<body>

    <h1>HTML Entities Demonstration</h1>

    <p>
        <strong>Special Characters:</strong><br>
        Less Than: &lt;<br>
        Greater Than: &gt;<br>
        Ampersand: &amp;<br>
        Double Quote: &quot;<br>
        Single Quote: &apos;
    </p>

    <p>
        <strong>Symbols:</strong><br>
        Copyright: &copy;<br>
        Trademark: &trade;<br>
        Registered Trademark: &reg;
    </p>
</body>
