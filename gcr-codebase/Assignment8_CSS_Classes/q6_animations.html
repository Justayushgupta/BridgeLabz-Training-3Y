<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSS Animations</title>
<style>
  @keyframes slide { 0% { transform: translateX(-100px); opacity: 0; } 100% { transform: translateX(100px); opacity: 1; } }
  @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-60px); } }
  @keyframes colorShift { 0% { color: #e63946; } 33% { color: #4361ee; } 66% { color: #52b788; } 100% { color: #e63946; } }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: Arial, sans-serif; background: #1a1a2e; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 60px; padding: 40px; }
  h1 { color: #e2b96f; }
  .items { display: flex; gap: 60px; align-items: center; justify-content: center; flex-wrap: wrap; }
  .demo { display: flex; flex-direction: column; align-items: center; gap: 20px; }
  .demo label { color: #aaa; font-size: 0.85rem; }
  .moving-box { width: 60px; height: 60px; background: #e63946; border-radius: 10px; animation: slide 2s ease-in-out infinite alternate; animation-delay: 0s; }
  .ball { width: 50px; height: 50px; border-radius: 50%; background: #4361ee; animation: bounce 1s ease-in-out infinite; animation-delay: 0.3s; box-shadow: 0 20px 20px rgba(67,97,238,0.3); }
  .color-text { font-size: 1.6rem; font-weight: bold; animation: colorShift 2s ease-in-out infinite; animation-delay: 0.6s; animation-direction: alternate; }
</style>
</head>
<body>
<h1>CSS Animations</h1>
<div class="items">
  <div class="demo">
    <div class="moving-box"></div>
    <label>Moving Box — slide @keyframes<br>animation-direction: alternate</label>
  </div>
  <div class="demo">
    <div class="ball"></div>
    <label>Bouncing Ball — translateY<br>animation-iteration-count: infinite</label>
  </div>
  <div class="demo">
    <div class="color-text">Hello World</div>
    <label>Color-changing Text<br>animation-delay: 0.6s</label>
  </div>
</div>
</body>
</html>
