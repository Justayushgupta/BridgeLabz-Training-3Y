<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Borders and Padding</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: Arial, sans-serif; background: #f5f5f5; padding: 40px 20px; }
  h1 { text-align: center; margin-bottom: 36px; color: #1a1a2e; }
  .row { display: flex; gap: 24px; justify-content: center; flex-wrap: wrap; }
  .box { width: 180px; height: 140px; display: flex; align-items: center; justify-content: center; text-align: center; font-size: 0.85rem; color: #333; background: #fff; transition: border-color 0.3s ease; padding: 16px; }
  .box span { pointer-events: none; }
  .solid { border: 3px solid #1a1a2e; border-radius: 4px; }
  .dashed { border: 3px dashed #e63946; border-radius: 8px; padding: 20px; }
  .double { border: 6px double #4cc9f0; border-radius: 12px; padding: 24px; }
  .groove { border: 6px groove #e2b96f; border-radius: 16px; padding: 28px; }
  .rounded { border: 3px solid #52b788; border-radius: 50px; padding: 20px; }
  .box:hover { border-color: #7b2d8b; }
</style>
</head>
<body>
<h1>Borders and Padding Demo</h1>
<div class="row">
  <div class="box solid"><span>Solid Border<br>border-radius: 4px<br>padding: 16px</span></div>
  <div class="box dashed"><span>Dashed Border<br>border-radius: 8px<br>padding: 20px</span></div>
  <div class="box double"><span>Double Border<br>border-radius: 12px<br>padding: 24px</span></div>
  <div class="box groove"><span>Groove Border<br>border-radius: 16px<br>padding: 28px</span></div>
  <div class="box rounded"><span>Rounded Corners<br>border-radius: 50px<br>padding: 20px</span></div>
</div>
</body>
</html>
