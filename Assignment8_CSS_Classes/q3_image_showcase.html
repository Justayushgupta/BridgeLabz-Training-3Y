<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Image Showcase</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: Arial, sans-serif; background: #111; padding: 40px 20px; }
  h1 { color: #fff; text-align: center; margin-bottom: 32px; }
  .gallery { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
  figure { border-radius: 12px; overflow: hidden; box-shadow: 0 6px 20px rgba(0,0,0,0.4); position: relative; }
  .img-box { width: 100%; height: 220px; display: flex; align-items: center; justify-content: center; font-size: 4rem; transition: transform 0.4s ease; }
  .overlay { position: absolute; inset: 0; background: rgba(0,0,0,0); transition: background 0.4s ease; border-radius: 12px 12px 0 0; }
  figure:hover .img-box { transform: scale(1.1); }
  figure:hover .overlay { background: rgba(0,0,0,0.35); }
  .c1 { background: linear-gradient(135deg,#e63946,#f4a261); }
  .c2 { background: linear-gradient(135deg,#4cc9f0,#4361ee); }
  .c3 { background: linear-gradient(135deg,#2d6a4f,#52b788); }
  .c4 { background: linear-gradient(135deg,#7b2d8b,#e040fb); }
  .c5 { background: linear-gradient(135deg,#f77f00,#fcbf49); }
  .c6 { background: linear-gradient(135deg,#0077b6,#00b4d8); }
  figcaption { background: #1a1a2e; color: #e2b96f; text-align: center; padding: 10px; font-size: 0.9rem; }
  @media (max-width: 700px) { .gallery { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<h1>Image Showcase</h1>
<div class="gallery">
  <figure><div class="overlay"></div><div class="img-box c1">🌅</div><figcaption>Golden Sunset</figcaption></figure>
  <figure><div class="overlay"></div><div class="img-box c2">🌊</div><figcaption>Ocean Waves</figcaption></figure>
  <figure><div class="overlay"></div><div class="img-box c3">🌲</div><figcaption>Deep Forest</figcaption></figure>
  <figure><div class="overlay"></div><div class="img-box c4">🌌</div><figcaption>Night Galaxy</figcaption></figure>
  <figure><div class="overlay"></div><div class="img-box c5">🏜️</div><figcaption>Desert Dunes</figcaption></figure>
  <figure><div class="overlay"></div><div class="img-box c6">🏔️</div><figcaption>Mountain Peak</figcaption></figure>
</div>
</body>
</html>
