<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Location & Travel Preferences</title>
</head>
<body>

    <h1>Select Your Travel Destination</h1>

    <form action="#" method="get">
        <p>
            <label for="country">Country:</label>
            <select id="country" name="country">
                <option value="india" selected>India</option>
                <option value="japan">Japan</option>
                <option value="italy">Italy</option>
                <option value="canada">Canada</option>
            </select>
        </p>

        <p>
            <label for="state">State / Province:</label>
            <select id="state" name="state">
                <option value="rajasthan" selected>Rajasthan</option>
                <option value="kerala">Kerala</option>
                <option value="tokyo">Tokyo Prefecture</option>
                <option value="ontario">Ontario</option>
            </select>
        </p>

        <p>
            <label for="city">City:</label>
            <select id="city" name="city">
                <option value="jaipur" selected>Jaipur</option>
                <option value="udaipur">Udaipur</option>
                <option value="kyoto">Kyoto</option>
                <option value="toronto">Toronto</option>
            </select>
        </p>

        <p>
            <label for="tourist-place">Favorite Tourist Place:</label>
            <select id="tourist-place" name="tourist_place">
                <option value="amber-fort" selected>Amber Fort</option>
                <option value="hawa-mahal">Hawa Mahal</option>
                <option value="city-palace">City Palace</option>
                <option value="jal-mahal">Jal Mahal</option>
            </select>
        </p>

        <p>
            <input type="submit" value="Confirm Selection">
        </p>
    </form>

    <hr>

    <h3>Selection Summary</h3>
    <p>
        You have currently selected <strong>India</strong> as your destination country, situated in the state of <strong>Rajasthan</strong>, exploring the historic city of <strong>Jaipur</strong> with <strong>Amber Fort</strong> as your primary favorite tourist attraction.
    </p>

</body>
</html>
