<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tooltip Demo</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: Arial, sans-serif; background: #f0f2f5; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding: 40px; }
  h1 { color: #1a1a2e; margin-bottom: 30px; }
  .row { display: flex; gap: 40px; justify-content: center; flex-wrap: wrap; }
  .tip-wrap { position: relative; display: inline-block; }
  .tip-target { padding: 14px 28px; background: #1a1a2e; color: #e2b96f; border-radius: 8px; font-size: 1rem; cursor: default; }
  .tooltip { position: absolute; bottom: calc(100% + 10px); left: 50%; transform: translateX(-50%); background: #333; color: #fff; padding: 8px 14px; border-radius: 6px; font-size: 0.82rem; white-space: nowrap; opacity: 0; pointer-events: none; transition: opacity 0.3s ease-in-out; }
  .tooltip::after { content: ''; position: absolute; top: 100%; left: 50%; transform: translateX(-50%); border: 6px solid transparent; border-top-color: #333; }
  .tip-wrap:hover .tooltip { opacity: 1; }
</style>
</head>
<body>
<h1>CSS Tooltip Demo</h1>
<div class="row">
  <div class="tip-wrap">
    <div class="tip-target">🏠 Home</div>
    <div class="tooltip">Go to the homepage</div>
  </div>
  <div class="tip-wrap">
    <div class="tip-target">📧 Email</div>
    <div class="tooltip">Send us an email</div>
  </div>
  <div class="tip-wrap">
    <div class="tip-target">⚙️ Settings</div>
    <div class="tooltip">Manage your settings</div>
  </div>
  <div class="tip-wrap">
    <div class="tip-target">🔔 Alerts</div>
    <div class="tooltip">View notifications</div>
  </div>
</div>
</body>
</html>
