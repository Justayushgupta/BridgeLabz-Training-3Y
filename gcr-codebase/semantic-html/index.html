<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Semantic HTML Wireframe Layout</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="layout-container">

        <header class="header">
            <div class="circle-btn"></div>
            <div class="nav-pills">
                <div class="pill"></div>
                <div class="pill"></div>
                <div class="pill"></div>
            </div>
            <div class="search-bar"></div>
            <div class="circle-btn"></div>
        </header>

        <div class="main-body">

            <aside class="sidebar">
                <div class="sidebar-item"></div>
                <div class="sidebar-item"></div>
                <div class="sidebar-item"></div>
                <div class="sidebar-item"></div>
            </aside>

            <main class="content-area">

                <section class="cards-grid">
                    <article class="card"></article>
                    <article class="card"></article>
                    <article class="card"></article>
                </section>

                <section class="labels-grid">
                    <div class="label-pill"></div>
                    <div class="label-pill"></div>
                    <div class="label-pill"></div>
                </section>

                <section class="center-actions">
                    <div class="action-box"></div>
                    <div class="sub-action-box"></div>
                </section>
            </main>
        </div>

        <footer class="footer">
            <div class="footer-left-pills">
                <div class="pill"></div>
                <div class="pill"></div>
                <div class="pill"></div>
            </div>
            <div class="footer-right-box"></div>
        </footer>
    </div>
</body>
</html>
