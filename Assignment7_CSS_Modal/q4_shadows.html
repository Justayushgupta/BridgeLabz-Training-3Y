<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shadows and Depth</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: Arial, sans-serif; background: #f0f2f5; padding: 60px 20px; }
  h1 { text-align: center; margin-bottom: 50px; color: #1a1a2e; text-shadow: 2px 2px 6px rgba(0,0,0,0.2); }
  .cards { display: flex; gap: 30px; justify-content: center; flex-wrap: wrap; }
  .card { background: #fff; border-radius: 16px; padding: 36px 28px; width: 240px; text-align: center; transition: box-shadow 0.3s ease, transform 0.3s ease; }
  .card:nth-child(1) { box-shadow: 2px 2px 8px rgba(0,0,0,0.1); }
  .card:nth-child(2) { box-shadow: 4px 8px 20px rgba(67,97,238,0.3); }
  .card:nth-child(3) { box-shadow: 0 0 20px rgba(230,57,70,0.4); }
  .card:hover { box-shadow: 0 20px 48px rgba(0,0,0,0.22); transform: translateY(-6px); }
  .card-icon { font-size: 2.8rem; margin-bottom: 16px; }
  .card h2 { font-size: 1.1rem; color: #1a1a2e; margin-bottom: 8px; text-shadow: 1px 1px 4px rgba(0,0,0,0.15); }
  .card p { font-size: 0.9rem; color: #666; }
</style>
</head>
<body>
<h1>Shadows and Depth</h1>
<div class="cards">
  <div class="card"><div class="card-icon">🧑</div><h2>Alex Johnson</h2><p>Subtle soft shadow — light, minimal depth effect.</p></div>
  <div class="card"><div class="card-icon">👩</div><h2>Priya Sharma</h2><p>Colored shadow — gives a blue tinted depth illusion.</p></div>
  <div class="card"><div class="card-icon">🧔</div><h2>Rahul Verma</h2><p>Glow shadow — red glow effect for emphasis.</p></div>
</div>
</body>
</html>
