<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSS Transformations</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: Arial, sans-serif; background: #f0f2f5; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 40px 20px; }
  h1 { color: #1a1a2e; margin-bottom: 50px; }
  .row { display: flex; gap: 40px; justify-content: center; flex-wrap: wrap; }
  .item { display: flex; flex-direction: column; align-items: center; gap: 16px; }
  .box { width: 120px; height: 120px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 2rem; transition: all 0.4s ease; cursor: default; }
  .rotate { background: #e63946; }
  .rotate:hover { transform: rotate(45deg); }
  .scale { background: #4361ee; }
  .scale:hover { transform: scale(1.4); }
  .translate { background: #52b788; }
  .translate:hover { transform: translate(12px, -12px); }
  .skew { background: #e2b96f; }
  .skew:hover { transform: skew(20deg, 10deg); }
  label { font-size: 0.85rem; color: #555; font-weight: bold; }
</style>
</head>
<body>
<h1>CSS Transformations</h1>
<div class="row">
  <div class="item"><div class="box rotate">🔄</div><label>rotate(45deg)</label></div>
  <div class="item"><div class="box scale">🔍</div><label>scale(1.4)</label></div>
  <div class="item"><div class="box translate">➡️</div><label>translate(12px,-12px)</label></div>
  <div class="item"><div class="box skew">↗️</div><label>skew(20deg,10deg)</label></div>
</div>
</body>
</html>
