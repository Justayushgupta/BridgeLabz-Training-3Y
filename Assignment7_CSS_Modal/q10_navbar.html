<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Navigation Bar</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: Arial, sans-serif; background: #f0f2f5; min-height: 100vh; display: flex; flex-direction: column; }
  nav { background: #1a1a2e; display: flex; justify-content: center; }
  nav a { color: #aaa; text-decoration: none; padding: 18px 28px; display: block; font-size: 0.95rem; border-bottom: 3px solid transparent; transition: all 0.3s ease; }
  nav a:hover { color: #e2b96f; border-bottom-color: #e2b96f; background: rgba(255,255,255,0.05); }
  nav a.active { color: #e2b96f; border-bottom-color: #e2b96f; }
  main { flex: 1; display: flex; align-items: center; justify-content: center; }
  main p { font-size: 1.2rem; color: #555; }
  footer { background: #1a1a2e; color: #aaa; text-align: center; padding: 16px; font-size: 0.9rem; }
  @media (max-width: 700px) {
    nav { flex-direction: column; }
    nav a { text-align: center; border-bottom: 1px solid rgba(255,255,255,0.08); border-left: 3px solid transparent; }
    nav a:hover, nav a.active { border-left-color: #e2b96f; border-bottom-color: transparent; }
  }
</style>
</head>
<body>
<nav>
  <a href="#" class="active">Home</a>
  <a href="#">About</a>
  <a href="#">Services</a>
  <a href="#">Portfolio</a>
  <a href="#">Contact</a>
</nav>
<main><p>Welcome! Click nav links to explore.</p></main>
<footer><p>&copy; 2026 BridgeLabz. All rights reserved.</p></footer>
</body>
</html>
