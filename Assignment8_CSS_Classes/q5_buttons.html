<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Button Collection</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: Arial, sans-serif; background: #f0f2f5; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; padding: 40px; }
  h1 { color: #1a1a2e; }
  .row { display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; }
  button { padding: 13px 30px; border-radius: 8px; font-size: 0.95rem; cursor: pointer; font-weight: bold; transition: all 0.25s ease; border: 2px solid transparent; }
  .primary { background: #4361ee; color: #fff; box-shadow: 0 4px 14px rgba(67,97,238,0.35); }
  .primary:hover { background: #3351d4; box-shadow: 0 6px 20px rgba(67,97,238,0.5); transform: translateY(-2px); }
  .primary:active { transform: translateY(0); box-shadow: none; }
  .primary:focus { outline: 3px solid #7b9cff; outline-offset: 3px; }
  .secondary { background: #52b788; color: #fff; box-shadow: 0 4px 14px rgba(82,183,136,0.35); }
  .secondary:hover { background: #3d9c6e; transform: translateY(-2px); }
  .secondary:active { transform: translateY(0); }
  .secondary:focus { outline: 3px solid #a7e8c4; outline-offset: 3px; }
  .outline { background: transparent; color: #e63946; border-color: #e63946; }
  .outline:hover { background: #e63946; color: #fff; transform: translateY(-2px); }
  .outline:active { transform: translateY(0); }
  .outline:focus { outline: 3px solid #ffa0a8; outline-offset: 3px; }
  .disabled { background: #ccc; color: #888; cursor: not-allowed; box-shadow: none; }
  .disabled:disabled { opacity: 0.6; }
</style>
</head>
<body>
<h1>Styled Button Collection</h1>
<div class="row">
  <button class="primary">Primary</button>
  <button class="secondary">Secondary</button>
  <button class="outline">Outline</button>
  <button class="disabled" disabled>Disabled</button>
</div>
</body>
</html>
